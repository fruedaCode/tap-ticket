<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A phone sharing a link with two other phones">
  <rect x="8" y="8" width="384" height="284" rx="24" fill="#FDECEA"/>
  <!-- host phone -->
  <rect x="58" y="58" width="116" height="184" rx="20" fill="#450A0A"/>
  <rect x="66" y="70" width="100" height="160" rx="10" fill="#FFFFFF"/>
  <rect x="84" y="106" width="64" height="40" rx="8" fill="#DC2626"/>
  <line x1="102" y1="112" x2="102" y2="140" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="132" cy="126" r="7" fill="#FFFFFF"/>
  <rect x="84" y="162" width="64" height="7" rx="3.5" fill="#E7D9D6"/>
  <rect x="84" y="176" width="44" height="7" rx="3.5" fill="#E7D9D6"/>
  <rect x="84" y="196" width="64" height="12" rx="6" fill="#DC2626" opacity="0.25"/>
  <!-- friend phones -->
  <rect x="252" y="40" width="76" height="122" rx="14" fill="#450A0A"/>
  <rect x="259" y="49" width="62" height="104" rx="8" fill="#FFFFFF"/>
  <circle cx="290" cy="86" r="13" fill="#DC2626" opacity="0.9"/>
  <rect x="269" y="110" width="42" height="6" rx="3" fill="#E7D9D6"/>
  <rect x="269" y="122" width="30" height="6" rx="3" fill="#E7D9D6"/>
  <rect x="252" y="174" width="76" height="106" rx="14" fill="#450A0A"/>
  <rect x="259" y="183" width="62" height="88" rx="8" fill="#FFFFFF"/>
  <circle cx="290" cy="214" r="13" fill="#D97706" opacity="0.9"/>
  <rect x="269" y="238" width="42" height="6" rx="3" fill="#E7D9D6"/>
  <rect x="269" y="250" width="30" height="6" rx="3" fill="#E7D9D6"/>
  <!-- connections -->
  <g fill="none" stroke="#DC2626" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 10">
    <path d="M174 138 C 208 118 224 102 252 100"/>
    <path d="M174 172 C 208 192 224 216 252 224"/>
  </g>
  <!-- share badge -->
  <circle cx="213" cy="150" r="22" fill="#DC2626"/>
  <g stroke="#FFFFFF" stroke-width="3.5">
    <line x1="209" y1="146" x2="218" y2="139"/>
    <line x1="209" y1="154" x2="217" y2="160"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="205" cy="150" r="4.5"/>
    <circle cx="221" cy="137" r="4.5"/>
    <circle cx="220" cy="163" r="4.5"/>
  </g>
</svg>
