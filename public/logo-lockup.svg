<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 48 508 124" role="img" aria-label="Tap Ticket">
  <!-- Horizontal lockup: ticket mark + wordmark -->
  <g transform="translate(20 26) rotate(-8 84 84)">
    <!-- ticket body with side notches -->
    <path d="M 14 36
             H 154
             Q 168 36 168 50
             V 70 A 14 14 0 0 1 168 98
             V 118 Q 168 132 154 132
             H 14
             Q 0 132 0 118
             V 98 A 14 14 0 0 1 0 70
             V 50 Q 0 36 14 36 Z"
          fill="#DC2626"/>
    <!-- tear-off perforation -->
    <line x1="47" y1="50" x2="47" y2="118"
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="3 10" opacity="0.85"/>
    <!-- tap ripple: open arcs radiating from the touch point -->
    <path d="M 108.7 49.2 A 36 36 0 1 1 83.2 74.7"
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <path d="M 112 61.8 A 23 23 0 1 1 95.8 78"
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <circle cx="118" cy="84" r="11" fill="#FFFFFF"/>
  </g>
  <text x="215" y="118"
        font-family="Inter, 'Geist', system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-2"
        fill="#450A0A">tap<tspan dx="10" fill="#DC2626">ticket</tspan></text>
</svg>
